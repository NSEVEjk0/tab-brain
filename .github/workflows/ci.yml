name: Check Tab Brain
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_cloud:
        description: Also verify an approved production cloud comparison in the same browser
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop --project=mobile --project=extension
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - run: npm --prefix functions test
      - run: npx --yes firebase-tools@15.36.0 emulators:exec --only firestore --project demo-tab-brain "npm --prefix functions run test:emulator"
  nano-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: google-chrome --version
      - run: npx playwright install ffmpeg
      - run: npm run test:e2e -- --config=playwright.nano.config.ts
        env:
          TAB_BRAIN_REAL_NANO: "1"
          TAB_BRAIN_GOOGLE_CHROME_PATH: /usr/bin/google-chrome
          TAB_BRAIN_VERIFY_CLOUD: ${{ inputs.verify_cloud && '1' || '0' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-nano-proof
          path: reports/nano-proof/
          retention-days: 7
